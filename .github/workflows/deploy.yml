name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            source ~/.nvm/nvm.sh
            cd /root/neog-Major-Project-1
            git checkout main && git pull
            cd backend
            npm i
            pm2 restart backend-project1
            pm2 save
            cd /root/neog-Major-Project-1/client/ecom-project
            npm i
            npm run build
            rm -rf /root/neog-Major-Project-1-client-app/dist/*
            cp -r dist/* /root/neog-Major-Project-1-client-app/dist/
